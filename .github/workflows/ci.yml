name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Le codegen Convex exige un déploiement. Sans clé, typecheck, tests et
      # build tournent quand même sur les fichiers `convex/_generated` versionnés.
      - name: Generate Convex API types
        if: env.CONVEX_DEPLOY_KEY != ''
        run: pnpm exec convex codegen

      - name: Verify generated Convex files are committed
        if: env.CONVEX_DEPLOY_KEY != ''
        run: git diff --exit-code convex/_generated

      - name: Compile i18n messages
        run: pnpm i18n

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

